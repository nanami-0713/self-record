# SelfRecord · XcodeGen 规格（design.md §8 目录树 / §11 风险 3）
#
# 生成（需完整 Xcode + xcodegen）：
#   cd app && xcodegen generate
#   → 产出 app/SelfRecord.xcodeproj（.gitignore 已忽略产出；本文件入库）
#   → open SelfRecord.xcodeproj，选模拟器 Cmd+R 运行
#
# App target 引用本目录的 SelfRecordApp.swift 与本地 package（仓库根
# Package.swift 的两个 library 产物：SelfRecordCore / SelfRecordUI——即
# design.md §8「App target 引用 app/ 与本地两个 package」的落点；本仓库
# 是单 package 双 library 形态，非两个独立包目录）。
#
# ⚠ 本机无完整 Xcode、未安装 xcodegen（design.md §0-3 实测）：本文件的
#   产出在本机零验证，属 §11 风险 3 声明面；配置保持最小常规形态。

name: SelfRecord

options:
  bundleIdPrefix: com.nanami
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  SelfRecord:
    path: ..

targets:
  SelfRecord:
    type: application
    platform: iOS
    sources:
      - SelfRecordApp.swift
      - Assets.xcassets
    dependencies:
      - package: SelfRecord
        product: SelfRecordCore
      - package: SelfRecord
        product: SelfRecordUI
    settings:
      base:
        PRODUCT_NAME: SelfRecord
        INFOPLIST_KEY_CFBundleDisplayName: SelfRecord
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        # 与 Package.swift 的 swiftLanguageModes: [.v6] 保持一致（需 Xcode 16+）
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 空白启动屏（现代必设：缺省会以传统分辨率/黑边运行）
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: >-
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
        # 明暗双主题：iOS 默认即支持明暗切换——刻意不设
        # INFOPLIST_KEY_UIUserInterfaceStyle（设置该键会锁死单一外观）；
        # 应用内手动覆盖经根部 preferredColorScheme（app/SelfRecordApp.swift）。
